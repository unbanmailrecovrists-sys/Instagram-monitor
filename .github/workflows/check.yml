name: IG Monitor Discord

on:
  schedule:
    - cron: '*/15 * * * *' # Har 15 min mein chalega
  workflow_dispatch: # Manual button ke liye

jobs:
  run-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install cloudscraper requests

      - name: Run Monitor
        run: python monitor.py

      - name: Commit Status File
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "actions@github.com"
          git pull --rebase origin main
          git add status.txt
          git commit -m "Update status" || echo "No changes"
          git push
